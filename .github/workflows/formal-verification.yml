name: formal-verification

on:
  push:
    branches:
      - 'revival/**'
    paths:
      - 'formal/**'
      - '.github/workflows/formal-verification.yml'
  pull_request:
    paths:
      - 'formal/**'
      - '.github/workflows/formal-verification.yml'
  workflow_dispatch:

jobs:
  lean-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned Lean proof-critical core
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: true
          nanoda: true
          nanoda-allow-sorry: false
          axiom-audit: true
      - name: Reject proof placeholders
        shell: bash
        run: |
          if grep -R -nE '\b(sorry|admit)\b' formal --include='*.lean'; then
            exit 1
          fi
