name: formal-verification

on:
  push:
    branches:
      - 'revival/**'
    paths:
      - 'formal/**'
      - '.github/workflows/formal-verification.yml'
  pull_request:
    paths:
      - 'formal/**'
      - '.github/workflows/formal-verification.yml'
  workflow_dispatch:

jobs:
  lean-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned Lean proof-critical core and audit axioms
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: true
          nanoda: false
          axiom-audit: true
      - name: Reject proof placeholders in project sources
        shell: bash
        run: |
          if grep -nE '\b(sorry|admit)\b' formal/StandardsCoalitionFormal.lean; then
            exit 1
          fi
          if grep -R -nE '\b(sorry|admit)\b' formal/StandardsCoalitionFormal --include='*.lean'; then
            exit 1
          fi
      - name: Replay exact proof module with pinned independent NanoDa kernel
        shell: bash
        working-directory: formal
        run: bash scripts/check_nanoda_exact.sh
