name: reproducibility

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run frozen verification gates
        run: make verify
      - name: Run Stage-11 hostile referee diagnostic
        run: python verification/stage11_cesd_referee_audit.py
      - name: Regenerate manuscript-facing outputs
        run: make outputs
      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended
      - name: Build manuscript scaffold
        run: make paper
